description: Vango Technologies V32F20X ADC

compatible: "vango,v32f20x-adc"

include: [adc-controller.yaml, pinctrl-device.yaml, base.yaml]

properties:
  reg:
    type: array
    required: true
  interrupts:
    type: array
    required: true
  clocks:
    type: phandle-array
    required: true
  resets:
    type: phandle-array
    required: false
  "#io-channel-cells":
    const: 1

io-channel-cells:
  - input
