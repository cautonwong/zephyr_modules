description: Vango Technologies V32F20X DMA Controller

compatible: "vango,v32f20x-dma"

include: [dma-controller.yaml, base.yaml]

properties:
  reg:
    type: array
    required: true
  interrupts:
    type: array
    required: true
  clocks:
    type: phandle-array
    required: true
  resets:
    type: phandle-array
    required: false
  "#dma-cells":
    const: 2

dma-cells:
  - channel
  - slot
